# Cloud Build CI/CD Pipeline Configuration
# Enterprise-grade deployment pipeline for BDC Platform

# Build configuration
options:
  # Use more powerful machine for faster builds
  machineType: 'E2_HIGHCPU_8'
  # Logging configuration
  logging: GCS_ONLY
  logsBucket: 'gs://bdc-platform-build-logs'
  # Build timeout (45 minutes)
  timeout: '2700s'

# Substitution variables (can be overridden)
substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'bdc-platform'
  _DEPLOY_ENV: 'production'
  _NODE_VERSION: '18'
  _PYTHON_VERSION: '3.12'

# Build steps
steps:
  # Step 1: Install dependencies and run tests
  - name: 'gcr.io/cloud-builders/docker'
    id: 'run-tests'
    args:
      - 'build'
      - '--target'
      - 'test'
      - '-t'
      - 'bdc-test'
      - '-f'
      - 'Dockerfile.test'
      - '.'
    waitFor: ['-']

  # Step 2: Run security scan
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'security-scan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Install security scanning tools
        pip install safety bandit
        
        # Scan Python dependencies
        cd backend
        safety check -r requirements.txt
        bandit -r app/ -f json -o ../security-report.json
        
        # Upload report to Cloud Storage
        gsutil cp ../security-report.json gs://bdc-platform-security-reports/${BUILD_ID}/
    waitFor: ['run-tests']

  # Step 3: Build frontend
  - name: 'node:${_NODE_VERSION}'
    id: 'build-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd frontend
        
        # Install dependencies
        npm ci --legacy-peer-deps
        
        # Run linting
        npm run lint
        
        # Run type checking
        npm run typecheck
        
        # Run tests
        npm run test:ci
        
        # Build production bundle
        REACT_APP_API_URL=https://api.bdc-platform.com \
        REACT_APP_ENVIRONMENT=production \
        npm run build
        
        # Optimize build
        npm run optimize:build
    waitFor: ['run-tests']

  # Step 4: Build backend container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bdc-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bdc-backend:latest'
      - '--build-arg'
      - 'PYTHON_VERSION=${_PYTHON_VERSION}'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'
    waitFor: ['security-scan']

  # Step 5: Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/bdc-backend'
    waitFor: ['build-backend']

  # Step 6: Run database migrations
  - name: 'gcr.io/google-appengine/exec-wrapper'
    id: 'migrate-database'
    args:
      - '-i'
      - 'gcr.io/$PROJECT_ID/bdc-backend:$SHORT_SHA'
      - '-s'
      - '$PROJECT_ID:${_REGION}:bdc-db-prod'
      - '-e'
      - 'DATABASE_URL=postgresql://bdc_user@localhost/bdc_production?host=/cloudsql/$PROJECT_ID:${_REGION}:bdc-db-prod'
      - '--'
      - 'python'
      - 'manage.py'
      - 'db'
      - 'upgrade'
    waitFor: ['push-backend']

  # Step 7: Deploy to App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-app-engine'
    args:
      - 'app'
      - 'deploy'
      - 'app.yaml'
      - '--project=$PROJECT_ID'
      - '--version=$SHORT_SHA'
      - '--no-promote'
      - '--quiet'
    waitFor: ['migrate-database', 'build-frontend']

  # Step 8: Run smoke tests
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'smoke-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Wait for deployment to be ready
        sleep 30
        
        # Run smoke tests
        DEPLOY_URL="https://$SHORT_SHA-dot-$PROJECT_ID.appspot.com"
        
        # Health check
        curl -f "${DEPLOY_URL}/_ah/health" || exit 1
        
        # API health check
        curl -f "${DEPLOY_URL}/api/v1/health" || exit 1
        
        # Frontend check
        curl -f "${DEPLOY_URL}/" || exit 1
        
        echo "Smoke tests passed!"
    waitFor: ['deploy-app-engine']

  # Step 9: Promote to production (if tests pass)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'promote-production'
    args:
      - 'app'
      - 'services'
      - 'set-traffic'
      - '--splits=$SHORT_SHA=100'
      - '--project=$PROJECT_ID'
      - '--quiet'
    waitFor: ['smoke-tests']

  # Step 10: Update Cloud CDN
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'invalidate-cdn'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Invalidate CDN cache for static assets
        gcloud compute url-maps invalidate-cdn-cache bdc-platform-lb \
          --path="/static/*" \
          --path="/assets/*" \
          --path="/index.html" \
          --async
    waitFor: ['promote-production']

  # Step 11: Notify deployment status
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'notify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Send deployment notification
        gcloud pubsub topics publish bdc-deployments \
          --message="{
            \"buildId\": \"$BUILD_ID\",
            \"commitSha\": \"$SHORT_SHA\",
            \"status\": \"success\",
            \"environment\": \"${_DEPLOY_ENV}\",
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"deployer\": \"$_PR_AUTHOR\"
          }"
    waitFor: ['promote-production']

# Artifacts to store
artifacts:
  objects:
    # Store build artifacts
    location: 'gs://bdc-platform-artifacts/${BUILD_ID}'
    paths:
      - 'frontend/dist/**/*'
      - 'security-report.json'
      - 'backend/coverage.xml'
      - 'frontend/coverage/**/*'

# Build images
images:
  - 'gcr.io/$PROJECT_ID/bdc-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/bdc-backend:latest'

# Timeout for the entire build
timeout: '2700s'