# Prometheus alerting rules for BDC platform

groups:
  - name: bdc_application_alerts
    interval: 30s
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(bdc_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(bdc_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: bdc-backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      # Slow response time alert
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(bdc_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.0
        for: 10m
        labels:
          severity: warning
          service: bdc-backend
        annotations:
          summary: "Slow response times detected"
          description: "95th percentile response time is {{ $value }}s"

      # High memory usage alert
      - alert: HighMemoryUsage
        expr: bdc_memory_percent > 85
        for: 5m
        labels:
          severity: warning
          service: bdc-backend
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"

      # Database connection issues
      - alert: DatabaseConnectionFailure
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "Database connection failure"
          description: "Cannot connect to PostgreSQL database"

      # Failed login attempts spike
      - alert: FailedLoginSpike
        expr: |
          sum(rate(bdc_login_attempts_total{status="failure"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          service: bdc-backend
        annotations:
          summary: "High number of failed login attempts"
          description: "{{ $value }} failed login attempts per second"

      # Application down
      - alert: ApplicationDown
        expr: up{job="bdc-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: bdc-backend
        annotations:
          summary: "BDC Backend is down"
          description: "The BDC backend service has been down for more than 1 minute"

      # Disk space warning
      - alert: LowDiskSpace
        expr: bdc_disk_percent > 80
        for: 10m
        labels:
          severity: warning
          service: bdc-backend
        annotations:
          summary: "Low disk space"
          description: "Disk usage is {{ $value }}%"

      # Request rate anomaly
      - alert: RequestRateAnomaly
        expr: |
          abs(
            rate(bdc_http_requests_total[5m]) - 
            rate(bdc_http_requests_total[5m] offset 1h)
          ) > 100
        for: 15m
        labels:
          severity: info
          service: bdc-backend
        annotations:
          summary: "Unusual request rate detected"
          description: "Request rate has changed significantly compared to 1 hour ago"