runtime: python312
entrypoint: gunicorn -b :$PORT main:app

instance_class: F4

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 2
  max_instances: 10
  min_pending_latency: 30ms
  max_pending_latency: automatic
  max_concurrent_requests: 50

env_variables:
  FLASK_ENV: "production"
  FLASK_APP: "wsgi.py"
  GOOGLE_CLOUD_PROJECT: "bilan-competence-449414"
  GAE_ENV: "standard"
  CLOUD_SQL_CONNECTION_NAME: "bilan-competence-449414:europe-west1:bdc-db"
  DB_NAME: "bdc_production"
  DB_USER: "bdc_user"
  CORS_ORIGINS: "https://bilan-competence-449414.ew.r.appspot.com"

handlers:
- url: /static
  static_dir: app/static
  secure: always

- url: /.*
  script: auto
  secure: always

# VPC connector disabled for now
# vpc_access_connector:
#   name: projects/bilan-competence-449414/locations/europe-west1/connectors/bdc-connector

# Health check configuration
readiness_check:
  path: "/ready"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300

liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2