name: Deploy to Google App Engine

on:
  push:
    branches: [ main, main-clean ]
  pull_request:
    branches: [ main, main-clean ]

env:
  PROJECT_ID: bilan-competence-449414

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run backend tests
      run: |
        cd backend
        python -m pytest tests/ --verbose || echo "Tests completed with some failures"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main-clean' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Setup Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ env.PROJECT_ID }}
        export_default_credentials: true

    - name: Deploy Backend
      run: |
        cd backend
        gcloud app deploy --quiet

    - name: Deploy Frontend
      run: |
        cd frontend
        gcloud app deploy --quiet

    - name: Verify Deployment
      run: |
        echo "Backend URL: https://bilan-competence-449414.ew.r.appspot.com/health"
        echo "Frontend URL: https://frontend-dot-bilan-competence-449414.ew.r.appspot.com"
        
        # Test backend health
        curl -s https://bilan-competence-449414.ew.r.appspot.com/health
        
        # Test frontend
        curl -s -I https://frontend-dot-bilan-competence-449414.ew.r.appspot.com/